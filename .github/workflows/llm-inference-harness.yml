name: Distributed LLM Serving System

on:
  push:
    paths:
      - "projects/llm-inference-optimization-harness/**"
      - ".github/workflows/llm-inference-harness.yml"
  pull_request:
    paths:
      - "projects/llm-inference-optimization-harness/**"
      - ".github/workflows/llm-inference-harness.yml"

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/llm-inference-optimization-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/llm-inference-optimization-harness/pyproject.toml
      - name: Install serving test dependencies
        run: python -m pip install -e '.[test]'
      - name: Build
        run: make
      - name: Smoke tests
        run: make test
      - name: Serving unit and integration tests
        run: pytest
      - name: Benchmark and correctness gate
        run: make bench
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm-inference-harness-results
          path: |
            projects/llm-inference-optimization-harness/results/benchmark_results.csv
            projects/llm-inference-optimization-harness/results/benchmark_results.json
            projects/llm-inference-optimization-harness/results/benchmark_summary.md
