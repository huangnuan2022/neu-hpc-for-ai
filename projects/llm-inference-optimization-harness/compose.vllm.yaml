services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      SERVING_BACKEND_ENDPOINTS: http://worker-0:8000,http://worker-1:8000,http://worker-2:8000,http://worker-3:8000
      SERVING_MODEL: Qwen/Qwen3-8B
      SERVING_MAX_IN_FLIGHT: "64"
      SERVING_REQUEST_TIMEOUT_SECONDS: "180"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8000:8000"
    depends_on:
      - worker-0
      - worker-1
      - worker-2
      - worker-3

  worker-0: &vllm-worker
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    command:
      - --model
      - Qwen/Qwen3-8B
      - --served-model-name
      - Qwen/Qwen3-8B
      - --dtype
      - bfloat16
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.90"
    ipc: host
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  worker-1:
    <<: *vllm-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  worker-2:
    <<: *vllm-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

  worker-3:
    <<: *vllm-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]

volumes:
  huggingface-cache:
