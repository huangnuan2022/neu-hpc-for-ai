services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      SERVING_BACKEND_ENDPOINTS: http://worker-0:8000
      SERVING_MODEL: Qwen/Qwen3-8B
      SERVING_MAX_IN_FLIGHT: "64"
      SERVING_REQUEST_TIMEOUT_SECONDS: "180"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8000:8000"
    depends_on:
      - worker-0

  worker-0:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    command:
      - --model
      - Qwen/Qwen3-8B
      - --served-model-name
      - Qwen/Qwen3-8B
      - --dtype
      - bfloat16
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.90"
      - --enable-prefix-caching
    ipc: host
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    ports:
      - "8101:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

volumes:
  huggingface-cache:
  vllm-cache:
